<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#07090B">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Kompass">
  <meta name="description" content="Gedanken sofort festhalten. In deinem Tempo ordnen.">
  <title>Alltags- &amp; Ideen-Kompass</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="./icon-180.png">
  <link rel="stylesheet" href="./src/styles.css">
</head>
<body>
<div class="shell">
  <aside class="side">
    <a class="brand" href="./"><span class="compass" aria-hidden="true">✳</span><span>KOMPASS</span></a>
    <nav class="nav" aria-label="Bereiche">
      <button class="nav-btn" data-view="inbox"><i aria-hidden="true">◎</i><span>Start</span><b></b></button>
      <button class="nav-btn" data-view="ideas"><i aria-hidden="true">◇</i><span>Ideen</span><b></b></button>
      <button class="nav-btn" data-view="todos"><i aria-hidden="true">✓</i><span>To-dos</span><b></b></button>
      <button class="nav-btn" data-view="events"><i aria-hidden="true">▦</i><span>Termine</span><b></b></button>
      <button class="nav-btn" data-view="meds"><i aria-hidden="true">⊕</i><span>Tabletten</span><b></b></button>
    </nav>
    <p class="side-note">Ein Gedanke genügt.<br>Die Ordnung kommt von selbst.</p>
  </aside>
  <main>
    <header class="top">
      <span class="brand mobile-only"><span class="compass" aria-hidden="true">✳</span></span>
      <h1 id="view-title">Gedankeneingang</h1>
      <span id="ai-state" class="pill ai"></span>
      <span id="connection" class="pill" role="status">Lokal</span>
      <button id="open-settings" class="icon-btn" type="button" aria-label="Einstellungen, Konto und Sicherung"><span aria-hidden="true">⚙</span></button>
    </header>
    <section class="capture" aria-label="Gedanken festhalten">
      <form id="capture-form">
        <label class="sr-only" for="dump">Dein Originaltext</label>
        <textarea id="dump" rows="1" placeholder="Was geht dir durch den Kopf?" required></textarea>
        <button class="btn primary" type="submit" aria-label="Gedanken sichern">＋<span class="wide-only"> Sichern</span></button>
      </form>
      <p class="capture-meta"><span id="save-status" role="status" aria-live="polite">Original bleibt vollständig erhalten · wird automatisch einsortiert.</span><span id="account-hint" class="muted"></span></p>
    </section>
    <div id="view-content" class="view"></div>
  </main>
</div>
<dialog id="settings" aria-labelledby="settings-title">
  <form method="dialog" class="dialog-head"><h2 id="settings-title">Einstellungen</h2><button class="icon-btn" aria-label="Schließen">✕</button></form>
  <div id="settings-body"></div>
</dialog>
<dialog id="image-dialog" class="image-dialog" aria-label="Foto">
  <form method="dialog" class="dialog-head"><span></span><button class="icon-btn" aria-label="Schließen">✕</button></form>
  <img alt="">
</dialog>
<script type="module" src="./src/app.js"></script>
</body>
</html>
